<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clapperboard.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0D" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="CineScope — Premium dark-mode movie discovery single-page application powered by TMDB. Explore curated genres, debounced search, and a persistent personal watchlist." />
    <meta name="keywords" content="movies, cinema, TMDB, film discovery, watchlist, trailers, ratings, genres, dark mode" />
    <meta name="author" content="CineScope Curator" />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="CineScope" />
    <meta property="og:title" content="CineScope — Cinematic Movie Discovery" />
    <meta property="og:description" content="Discover films, explore curated genres, read comprehensive dossiers, and curate your personal cinema watchlist." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/clapperboard.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CineScope — Cinematic Movie Discovery" />
    <meta name="twitter:description" content="Discover films, explore curated genres, read comprehensive dossiers, and curate your personal cinema watchlist." />
    <meta name="twitter:image" content="/clapperboard.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <title>CineScope | Discover Cinema</title>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased min-h-screen selection:bg-[var(--primary)]/35 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
